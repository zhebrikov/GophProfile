# Default values for local / Rancher Desktop.
nameOverride: ""
fullnameOverride: ""

image:
  repository: gophprofile
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# When set, reuse an existing Secret instead of creating one from values.secrets.
existingSecret: ""

secrets:
  databaseURL: "postgres://gophprofile:gophprofile@gophprofile-postgres:5432/gophprofile?sslmode=disable"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  brokerURL: "amqp://guest:guest@gophprofile-rabbitmq:5672/"

config:
  httpAddr: ":8080"
  metricsAddr: ":9091"
  s3Endpoint: "gophprofile-minio:9000"
  s3Bucket: "avatars"
  s3UseSSL: "false"
  s3PublicEndpoint: "http://gophprofile.local/s3"
  rabbitmqExchange: "avatars.exchange"
  publicURL: "http://gophprofile.local"
  webDir: "/app/web"
  maxFileSize: "10485760"
  rateLimit: "20"
  otelServiceName: "gophprofile"
  otelEndpoint: ""

server:
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 70
    memoryUtilization: 80
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

worker:
  replicas: 1
  metricsPort: 9091
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    cpuUtilization: 70
    memoryUtilization: 80
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

ingress:
  enabled: true
  className: nginx
  host: gophprofile.local
  # Strip this prefix and proxy to in-chart MinIO (matches config.s3PublicEndpoint path).
  minioPath: /s3
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
  # Example for TLS (cert-manager):
  # tls:
  #   - secretName: gophprofile-tls
  #     hosts:
  #       - gophprofile.local
  tls: []

# Requires Prometheus Operator CRDs. Enable with --set serviceMonitor.enabled=true
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Same CRDs as ServiceMonitor. Mirrors monitoring/prometheus/alerts.yml.
prometheusRule:
  enabled: false
  labels: {}

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  # Allow Prometheus Operator to scrape server :8080/metrics
  metrics:
    enabled: true
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

migrate:
  enabled: true
  backoffLimit: 6

# Local infra (Postgres, MinIO, RabbitMQ). Disable for production / external deps.
infra:
  enabled: true
  postgres:
    image: postgres:16-alpine
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    auth:
      user: gophprofile
      password: gophprofile
      database: gophprofile
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    persistence:
      enabled: false
      size: 2Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
