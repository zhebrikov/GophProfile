# Minimal RBAC: ServiceAccount has no RoleBindings (no API access needed).
# Explicit Role kept for auditability / future extension (empty rules).
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gophprofile.fullname" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gophprofile.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gophprofile.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
