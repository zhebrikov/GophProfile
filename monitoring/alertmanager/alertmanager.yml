global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
  routes:
    - match:
        severity: critical
      receiver: default
      continue: true

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-webhook:8080/alert
        send_resolved: true
