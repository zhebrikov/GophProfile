apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: OpenSearch
    type: grafana-opensearch-datasource
    uid: opensearch
    access: proxy
    url: http://opensearch:9200
    editable: false
    jsonData:
      database: "gophprofile-logs*"
      timeField: "@timestamp"
      version: "2.15.0"
      flavor: "opensearch"
      logMessageField: msg
      logLevelField: level
      pplEnabled: true
      dataLinks:
        - field: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: jaeger
          urlDisplayLabel: View Trace

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
