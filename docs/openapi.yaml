openapi: 3.0.3
info:
  title: GophProfile API
  description: Microservice for user avatar upload, storage, and delivery.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Compose
  - url: http://gophprofile.local
    description: Local Kubernetes Ingress
paths:
  /live:
    get:
      summary: Liveness probe
      tags: [Health]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Readiness probe
      tags: [Health]
      responses:
        "200":
          description: Dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health:
    get:
      summary: Dependency health check
      tags: [Health]
      responses:
        "200":
          description: All components ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /metrics:
    get:
      summary: Prometheus metrics
      tags: [Observability]
      responses:
        "200":
          description: Prometheus text exposition format
  /api/v1/avatars:
    post:
      summary: Upload avatar
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: File too large
        "429":
          description: Rate limited
  /api/v1/avatars/{avatar_id}:
    get:
      summary: Get avatar image
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/AvatarID"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "304":
          description: Not modified (ETag)
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft-delete avatar
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/AvatarID"
        - $ref: "#/components/parameters/UserIDHeader"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/avatars/{avatar_id}/metadata:
    get:
      summary: Get avatar metadata
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/AvatarID"
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{user_id}/avatar:
    get:
      summary: Get latest user avatar image
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft-delete latest user avatar
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/UserIDHeader"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/users/{user_id}/avatars:
    get:
      summary: List user avatars metadata
      tags: [Avatars]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: List of metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetadataResponse"
components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
    AvatarID:
      name: avatar_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    Size:
      name: size
      in: query
      schema:
        type: string
        enum: [original, 100x100, 300x300]
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [jpeg, png, webp]
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        components:
          type: object
          additionalProperties:
            type: string
    UploadResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        url:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
    MetadataResponse:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        file_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        dimensions:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        thumbnails:
          type: array
          items:
            type: object
            properties:
              size:
                type: string
              key:
                type: string
              url:
                type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
        max_size:
          type: integer
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Avatar not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
